name: FATAFAT-CHAI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  DOCKER_IMAGE_CLIENT: fatafat-chai-client
  DOCKER_IMAGE_SERVER: fatafat-chai-server

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & Install Dependencies
  # ─────────────────────────────────────────────
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

  # ─────────────────────────────────────────────
  # Job 2: Build Client
  # ─────────────────────────────────────────────
  build-client:
    name: 🏗️ Build Client
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Test Server
  # ─────────────────────────────────────────────
  test-server:
    name: 🧪 Test Server
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      - name: Run server tests
        working-directory: ./server
        run: npx jest --passWithNoTests --forceExit
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 4: Docker Build & Push
  # ─────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    needs: [build-client, test-server]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build client Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_CLIENT }}:latest ./client
          docker build -t ${{ env.DOCKER_IMAGE_CLIENT }}:${{ github.sha }} ./client

      - name: Build server Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_SERVER }}:latest ./server
          docker build -t ${{ env.DOCKER_IMAGE_SERVER }}:${{ github.sha }} ./server

      - name: Test Docker Compose
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose down

  # ─────────────────────────────────────────────
  # Job 5: Deploy (placeholder)
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "======================================"
          echo "  ☕ FATAFAT-CHAI Deployment Ready!"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor:  ${{ github.actor }}"
          echo "======================================"
          # Add your deployment commands here
          # Examples:
          #   - Deploy to Render, Vercel, AWS, etc.
          #   - Push Docker images to DockerHub/ECR
          #   - SSH into server and pull latest
