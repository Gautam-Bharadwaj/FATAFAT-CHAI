version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    assignees:
      - Gautam-Bharadwaj
    labels:
      - dependencies
      - automated
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps):'

  - package-ecosystem: npm
    directory: '/server'
    schedule:
      interval: weekly
      day: monday
    assignees:
      - Gautam-Bharadwaj
    labels:
      - dependencies
      - automated
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps):'

  - package-ecosystem: npm
    directory: '/client'
    schedule:
      interval: weekly
      day: monday
    assignees:
      - Gautam-Bharadwaj
    labels:
      - dependencies
      - automated
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps):'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    assignees:
      - Gautam-Bharadwaj
    labels:
      - dependencies
      - automated
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps):'
